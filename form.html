<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form | WDD 131</title>

    <meta name="description"
        content="Submit a product review using this responsive WDD 131 product review form.">
    <meta name="author" content="Great Afangide">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <div class="form-group">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating">
                    <label for="rating1">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <span>☆</span>
                        <small>1</small>
                    </label>

                    <label for="rating2">
                        <input type="radio" id="rating2" name="rating" value="2">
                        <span>☆</span>
                        <small>2</small>
                    </label>

                    <label for="rating3">
                        <input type="radio" id="rating3" name="rating" value="3">
                        <span>☆</span>
                        <small>3</small>
                    </label>

                    <label for="rating4">
                        <input type="radio" id="rating4" name="rating" value="4">
                        <span>☆</span>
                        <small>4</small>
                    </label>

                    <label for="rating5">
                        <input type="radio" id="rating5" name="rating" value="5">
                        <span>☆</span>
                        <small>5</small>
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset>
                <legend>Useful Features</legend>
                <p class="hint">Check all that apply</p>

                <label class="checkbox-option" for="feature1">
                    <input type="checkbox" id="feature1" name="features" value="Durability">
                    Durability
                </label>

                <label class="checkbox-option" for="feature2">
                    <input type="checkbox" id="feature2" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label class="checkbox-option" for="feature3">
                    <input type="checkbox" id="feature3" name="features" value="Performance">
                    Performance
                </label>

                <label class="checkbox-option" for="feature4">
                    <input type="checkbox" id="feature4" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <div class="form-group">
                <label for="writtenReview">Written Review <span>(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview"
                    placeholder="Write your review here..."></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name <span>(Optional)</span></label>
                <input type="text" id="userName" name="userName"
                    placeholder="Enter your name">
            </div>

            <input class="submit-button" type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> Great Afangide | WDD 131: Dynamic Web Fundamentals</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
