<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review Submitted | WDD 131</title>

    <meta name="description"
        content="Confirmation page for the WDD 131 product review form.">
    <meta name="author" content="Great Afangide">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main class="confirmation">

        <section class="confirmation-card">

            <div class="success-icon">✓</div>

            <h2>Thank You!</h2>

            <p>
                Your product review has been successfully submitted.
            </p>

            <div class="review-count">
                <p>You have completed</p>
                <strong id="reviewCounter">0</strong>
                <p>review(s).</p>
            </div>

            <a href="form.html" class="back-button">
                Write Another Review
            </a>

        </section>

    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> Great Afangide | WDD 131: Dynamic Web Fundamentals</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
